syntax = "proto3";

package cluster;

option java_package = "com.tcc.raft.grpc.proto";
option java_outer_classname = "ClusterProto";
option java_multiple_files = false;

// ============================================================================
// Dados persistidos no log Raft para cada tipo de evento
// ============================================================================

// Conteúdo de uma entrada CONFIG_CHANGE no log.
// Modela uma única mudança no cluster usando o mecanismo de
// "single-server changes": apenas uma mudança por vez é permitida,
// e ela só é processada após a entrada anterior ter sido confirmada.
message ConfigChangeData {
  // Operação a ser realizada no cluster.
  Operation operation = 1;

  // Identificador único do nó afetado pela mudança.
  string node_id = 2;

  // Endereço gRPC do nó no formato host:port.
  // Obrigatório para ADD_NODE, ignorado para REMOVE_NODE.
  string grpc_address = 3;

  // true se o nó sendo adicionado é um árbitro (não hospeda PostgreSQL).
  // Árbitros participam das votações mas não são elegíveis para
  // se tornar Primary do PostgreSQL.
  bool is_arbiter = 4;

  enum Operation {
    ADD_NODE = 0;
    REMOVE_NODE = 1;
  }
}

// Conteúdo de uma entrada FAILOVER no log.
// Registra a troca do Primary do PostgreSQL para auditoria e rastreabilidade.
message FailoverData {
  // Identificador do líder anterior (nó que estava com o Primary).
  string old_leader_id = 1;

  // Identificador do novo líder (nó que assumirá o Primary).
  string new_leader_id = 2;

  // Motivo do failover (ex: "heartbeat_timeout", "pg_unhealthy", "manual").
  string reason = 3;

  // Timestamp Unix (milissegundos) em que o failover foi iniciado.
  int64 initiated_at_ms = 4;
}

// ============================================================================
// Gerenciamento do cluster (operações administrativas)
// ============================================================================

// Requisição para adicionar ou remover um nó do cluster.
// Esta chamada só é aceita pelo líder atual.
// O líder valida, cria a entrada CONFIG_CHANGE e a replica via Raft.
message ConfigChangeRequest {
  ConfigChangeData change = 1;
}

message ConfigChangeResponse {
  // true se a mudança foi aceita e está em processo de replicação.
  bool accepted = 1;

  // Mensagem descritiva (erro ou confirmação).
  string message = 2;

  // ID do líder atual. Preenchido mesmo em caso de erro,
  // para que o cliente saiba para onde redirecionar a requisição.
  string leader_id = 3;
}

// ============================================================================
// Consulta de status do cluster
// ============================================================================

message ClusterStatusRequest {}

// Informações sobre um nó individual do cluster.
message NodeInfo {
  string node_id = 1;
  string grpc_address = 2;

  // Papel atual do nó no Raft.
  string raft_role = 3; // "LEADER", "FOLLOWER", "CANDIDATE"

  // true se o nó é um árbitro (sem PostgreSQL).
  bool is_arbiter = 4;

  // Estado do PostgreSQL local. Relevante apenas se is_arbiter=false.
  string pg_status = 5; // "PRIMARY", "STANDBY", "UNHEALTHY", "N/A"

  // true se o nó está respondendo às comunicações do cluster.
  bool reachable = 6;
}

message ClusterStatusResponse {
  // Identificador do líder atual.
  string leader_id = 1;

  // Mandato atual do cluster.
  int64 current_term = 2;

  // Lista com informações de todos os nós conhecidos.
  repeated NodeInfo nodes = 3;

  // Índice da última entrada confirmada no log.
  int64 commit_index = 4;
}

// ============================================================================
// Serviço de gerenciamento do cluster
//
// Exposto pelo líder para receber operações administrativas.
// Seguidores que receberem estas chamadas devem retornar o ID do líder.
// ============================================================================
service ClusterManagementService {
  // Submete uma mudança de configuração (add/remove nó) ao líder.
  rpc SubmitConfigChange(ConfigChangeRequest) returns (ConfigChangeResponse);

  // Retorna o estado atual do cluster: papéis, saúde do PostgreSQL, etc.
  rpc GetClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
}
