# =============================================================================
# Configuração do node-1 — Ambiente de validação com 3 nós (Notebook)
# =============================================================================

node-id: "node-1"
grpc-address: "192.168.56.101:9090"
arbiter: false

postgres:
  host: "127.0.0.1"
  port: 5432
  database: "postgres"
  user: "raft_monitor"
  password: "raft_mon_123"
  data-dir: "/var/lib/postgresql/16/main"
  health-check-interval-ms: 3000
  health-check-failure-threshold: 3

raft:
  heartbeat-interval-ms: 5000
  election-timeout-min-ms: 15000
  election-timeout-max-ms: 30000
  rpc-timeout-ms: 3000
  # Proteção do líder ativo; false só para experimentos comparativos (ver node.yaml.example)
  pre-vote: true
  check-quorum: true

storage:
  log-dir: "/var/lib/raft-ha-manager"

peers:
  - id: "node-1"
    grpc-address: "192.168.56.101:9090"
    arbiter: false

  - id: "node-2"
    grpc-address: "192.168.56.102:9090"
    arbiter: false

  - id: "node-3"
    grpc-address: "192.168.56.103:9090"
    arbiter: true
